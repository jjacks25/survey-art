[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "land-survey-scraper"
version = "0.1.0"
description = "Scrape county websites for land survey data."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = []
keywords = ["scraper", "land-survey", "county"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "boto3>=1.43.31",
    "browser-use>=0.12.0",
    "crawl4ai>=0.4.0",
    "httpx>=0.27.0",
    "playwright>=1.58.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=6.9.1",
    "rich>=13.0.0",
]

[project.scripts]
land-survey-scraper = "land_survey_scraper.__main__:main"

[project.optional-dependencies]
dev = []

[dependency-groups]
dev = [
    "moto[cloudformation,s3,secretsmanager]>=5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/land_survey_scraper"]

[tool.uv]
# Optional: pin Python version for local dev
# python = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/land_survey_scraper"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__"]
