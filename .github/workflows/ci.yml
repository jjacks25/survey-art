name: CI

on:
  pull_request:
    branches: [main]

# A new push to the PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# Three independent jobs so they run side by side. Same commands as `make lint` /
# `make test`, minus the docker wrapper — the runner has uv directly.
jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # ruff only, at the locked version — no need to install the workspace.
      - run: uvx ruff@0.15.5 check apps/worker apps/api packages infra
      - run: uvx ruff@0.15.5 format --check apps/worker apps/api packages infra

  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13" # what the images run
          enable-cache: true
      - run: uv sync --frozen --group dev
      # AWS is moto, county sites and Bedrock are faked — no secrets or browsers needed.
      - run: uv run pytest -n auto

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build # tsc -b + vite build
