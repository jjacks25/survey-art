[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "survey-art"
version = "0.1.0"
description = "Scrape county websites for land survey data (Fargate worker + CLI)."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.31",
    "browser-use>=0.12.0",
    "crawl4ai>=0.4.0",
    "httpx>=0.27.0",
    # pillow + pypdf: read a scanned survey PDF into model-sized tiles (id_extraction).
    "pillow>=11.0.0",
    "playwright>=1.58.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=6.9.1",
    "rich>=13.0.0",
    "survey-shared",
]

[project.scripts]
survey-art = "survey_art.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["survey_art"]

[tool.uv.sources]
survey-shared = { workspace = true }
