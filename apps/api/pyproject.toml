[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "survey-api"
version = "0.1.0"
description = "FastAPI job-broker API for survey-art (thin, no browser/scraper deps)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "survey-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
survey-shared = { workspace = true }
